<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Impressum</title>
<meta name="robots" content="noindex">
<script>
  window.__siteLanguage = localStorage.getItem('siteLanguage') === 'en' ? 'en' : 'de';
  document.documentElement.lang = window.__siteLanguage;
</script>
<link rel="icon" href="logomail.jpeg">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root{
    --paper:#efe6d2; --card:#f8f2e2; --ink:#2a2420; --ink-soft:#6b5d4c;
    --ink-faint:#a99d87; --oxblood:#7c2f2f; --rule:rgba(42,36,32,0.18);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font-family:'Source Serif 4', Georgia, serif;-webkit-font-smoothing:antialiased;
  }
  .page{max-width:760px;margin:0 auto;padding:48px 28px 80px;}
  a{color:var(--oxblood);}
  .page-header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap;}
  .back{
    display:inline-block;text-decoration:none;color:var(--ink-soft);
    font-family:'JetBrains Mono',monospace;font-size:0.68rem;letter-spacing:0.1em;text-transform:uppercase;
    border-bottom:1px solid var(--rule);padding-bottom:3px;
  }
  .back:hover{color:var(--oxblood);border-color:var(--oxblood);}
  .language-switch{display:flex;align-items:center;gap:8px;}
  .language-switch .language-sep{color:var(--ink-faint);opacity:0.8;font-size:0.9rem;line-height:1;user-select:none;}
  .language-switch button{font-size:1rem;line-height:1;background:none;border:none;cursor:pointer;filter:saturate(0.95);transition:transform .18s, filter .18s, opacity .18s;}
  .language-switch button:hover{transform:translateY(-1px);filter:saturate(1.1);opacity:0.9;}
  h1{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:2.1rem;margin:0 0 40px;}
  h2{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:1.25rem;margin:38px 0 10px;}
  p, li{line-height:1.85;font-size:0.96rem;color:var(--ink);margin:0 0 12px;}
  .fill{
    background:#f3e2c4;border:1px dashed var(--oxblood);border-radius:4px;
    padding:2px 8px;font-family:'JetBrains Mono',monospace;font-size:0.82rem;color:var(--oxblood);
    white-space:nowrap;
  }
  .note{
    background:var(--card);border:1px solid var(--rule);border-left:3px solid var(--oxblood);
    border-radius:4px;padding:16px 20px;font-size:0.88rem;color:var(--ink-soft);line-height:1.75;
    margin:28px 0;
  }
</style>
</head>
<body>
<div class="page">
  <div class="page-header">
    <a class="back" href="index.html" id="backLinkLabel">← Zurück</a>
    <div class="language-switch" aria-label="Language switcher">
      <button type="button" aria-label="Deutsch" title="Deutsch">🇦🇹</button>
      <span class="language-sep" aria-hidden="true">|</span>
      <button type="button" aria-label="English" title="English">🇬🇧</button>
    </div>
  </div>
  <h1 id="pageTitleLabel">Impressum</h1>
  <div id="impressumContent"></div>
</div>
<script>
  const pageTitleLabel = document.getElementById('pageTitleLabel');
  const backLinkLabel = document.getElementById('backLinkLabel');
  const impressumContent = document.getElementById('impressumContent');
  const languageButtons = document.querySelectorAll('.language-switch button');

  const deContent = `
    <p><strong>Angaben gemäß § 5 E-Commerce-Gesetz (ECG) und § 25 Mediengesetz (MedienG)</strong></p>
    <h2>Dienstanbieterin / Medieninhaberin</h2>
    <p>Maleen Schneider<br>Wien, Österreich</p>
    <h2>Kontakt</h2>
    <p>E-Mail: studio.maypaints@gmail.com<br>Telefon: folgt noch</p>
    <h2>Angaben zum Blog-Bereich (Offenlegung gem. § 25 MedienG)</h2>
    <p>Da diese Website auch einen Projektblog umfasst, gilt sie in diesem Teil als Medium im Sinne des Mediengesetzes:</p>
    <ul>
      <li>Medieninhaberin: Maleen Schneider, Anschrift wie oben</li>
      <li>Grundlegende Richtung (Blattlinie): Persönlicher Projektblog rund um meine Arbeit als Hochzeitsmalerin — Einblicke in Entstehungsprozesse, Projekte und künstlerische Themen. Keine kommerzielle Fremdwerbung, keine politische Ausrichtung.</li>
    </ul>
    <h2>Haftungsausschluss</h2>
    <ul>
      <li><strong>Inhalte:</strong> Die Inhalte dieser Website wurden mit größter Sorgfalt erstellt. Für die Richtigkeit, Vollständigkeit und Aktualität der Inhalte kann jedoch keine Gewähr übernommen werden.</li>
      <li><strong>Links:</strong> Diese Website enthält Links zu externen Websites Dritter (z. B. Instagram), auf deren Inhalte kein Einfluss besteht. Für diese fremden Inhalte kann daher keine Gewähr übernommen werden. Für die Inhalte der verlinkten Seiten ist stets der jeweilige Anbieter verantwortlich.</li>
      <li><strong>Urheberrecht:</strong> Die durch mich erstellten Inhalte und Werke (insbesondere Gemälde, Fotografien) auf dieser Website unterliegen dem österreichischen Urheberrecht. Vervielfältigung, Bearbeitung, Verbreitung und jede Art der Verwertung außerhalb der Grenzen des Urheberrechtes bedürfen meiner schriftlichen Zustimmung.</li>
    </ul>
    <p><strong>Stand: 24.07.2026</strong></p>
  `;

  const enContent = `
    <p><strong>Information according to § 5 E-Commerce Act (ECG) and § 25 Media Act (MedienG)</strong></p>
    <h2>Service provider / media owner</h2>
    <p>Maleen Schneider<br>Vienna, Austria</p>
    <h2>Contact</h2>
    <p>E-mail: studio.maypaints@gmail.com<br>Phone: to follow</p>
    <h2>Information about the blog section (disclosure pursuant to § 25 MedienG)</h2>
    <p>Since this website also includes a project blog, this part is considered a medium within the meaning of the Media Act:</p>
    <ul>
      <li>Media owner: Maleen Schneider, address as above</li>
      <li>Basic direction (editorial line): Personal project blog about my work as a wedding painter — insights into creative processes, projects, and artistic themes. No commercial third-party advertising, no political orientation.</li>
    </ul>
    <h2>Disclaimer</h2>
    <ul>
      <li><strong>Content:</strong> The content of this website has been created with the utmost care. However, no guarantee can be given for the accuracy, completeness, or timeliness of the content.</li>
      <li><strong>Links:</strong> This website contains links to external third-party websites (e.g. Instagram), over which I have no influence. I therefore cannot assume any responsibility for these external contents. The respective provider is always responsible for the content of linked pages.</li>
      <li><strong>Copyright:</strong> The content and works created by me (especially paintings and photographs) on this website are subject to Austrian copyright law. Reproduction, editing, distribution, and any form of use outside the limits of copyright require my written consent.</li>
    </ul>
    <p><strong>Effective date: 24.07.2026</strong></p>
  `;

  function setLanguage(lang){
    const isEnglish = lang === 'en';
    localStorage.setItem('siteLanguage', isEnglish ? 'en' : 'de');
    document.documentElement.lang = isEnglish ? 'en' : 'de';
    if(pageTitleLabel) pageTitleLabel.textContent = isEnglish ? 'Imprint' : 'Impressum';
    if(backLinkLabel) backLinkLabel.innerHTML = isEnglish ? '← Back' : '← Zurück';
    if(impressumContent) impressumContent.innerHTML = isEnglish ? enContent : deContent;
    languageButtons.forEach((button)=>{
      const active = (isEnglish && button.title === 'English') || (!isEnglish && button.title === 'Deutsch');
      button.setAttribute('aria-pressed', active ? 'true' : 'false');
    });
  }

  const austrianFlag = document.querySelector('.language-switch button[title="Deutsch"]');
  const englishFlag = document.querySelector('.language-switch button[title="English"]');
  if(austrianFlag) austrianFlag.addEventListener('click', ()=> setLanguage('de'));
  if(englishFlag) englishFlag.addEventListener('click', ()=> setLanguage('en'));

  setLanguage(window.__siteLanguage || 'de');
</script>
</body>
</html>
