<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Datenschutzerklärung</title>
<meta name="robots" content="noindex">
<script>
  window.__siteLanguage = localStorage.getItem('siteLanguage') === 'en' ? 'en' : 'de';
  document.documentElement.lang = window.__siteLanguage;
</script>
<link rel="icon" href="logomail.jpeg">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root{
    --paper:#efe6d2; --card:#f8f2e2; --ink:#2a2420; --ink-soft:#6b5d4c;
    --ink-faint:#a99d87; --oxblood:#7c2f2f; --rule:rgba(42,36,32,0.18);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font-family:'Source Serif 4', Georgia, serif;-webkit-font-smoothing:antialiased;
  }
  .page{max-width:760px;margin:0 auto;padding:48px 28px 80px;}
  a{color:var(--oxblood);}
  .page-header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap;}
  .back{
    display:inline-block;text-decoration:none;color:var(--ink-soft);
    font-family:'JetBrains Mono',monospace;font-size:0.68rem;letter-spacing:0.1em;text-transform:uppercase;
    border-bottom:1px solid var(--rule);padding-bottom:3px;
  }
  .back:hover{color:var(--oxblood);border-color:var(--oxblood);}
  .language-switch{display:flex;align-items:center;gap:8px;}
  .language-switch .language-sep{color:var(--ink-faint);opacity:0.8;font-size:0.9rem;line-height:1;user-select:none;}
  .language-switch button{font-size:1rem;line-height:1;background:none;border:none;cursor:pointer;filter:saturate(0.95);transition:transform .18s, filter .18s, opacity .18s;}
  .language-switch button:hover{transform:translateY(-1px);filter:saturate(1.1);opacity:0.9;}
  h1{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:2.1rem;margin:0 0 8px;}
  .updated{font-family:'JetBrains Mono',monospace;font-size:0.66rem;color:var(--ink-faint);letter-spacing:0.06em;margin-bottom:40px;}
  h2{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:1.25rem;margin:38px 0 10px;}
  p, li{line-height:1.85;font-size:0.96rem;color:var(--ink);margin:0 0 12px;}
  ul{padding-left:22px;}
  .fill{
    background:#f3e2c4;border:1px dashed var(--oxblood);border-radius:4px;
    padding:2px 8px;font-family:'JetBrains Mono',monospace;font-size:0.82rem;color:var(--oxblood);
    white-space:nowrap;
  }
  .note{
    background:var(--card);border:1px solid var(--rule);border-left:3px solid var(--oxblood);
    border-radius:4px;padding:16px 20px;font-size:0.88rem;color:var(--ink-soft);line-height:1.75;
    margin:28px 0;
  }
</style>
</head>
<body>
<div class="page">
  <div class="page-header">
    <a class="back" href="index.html" id="backLinkLabel">← Zurück</a>
    <div class="language-switch" aria-label="Language switcher">
      <button type="button" aria-label="Deutsch" title="Deutsch">🇦🇹</button>
      <span class="language-sep" aria-hidden="true">|</span>
      <button type="button" aria-label="English" title="English">🇬🇧</button>
    </div>
  </div>
  <h1 id="pageTitleLabel">Datenschutzerklärung</h1>
  <div class="updated" id="updatedLabel">Stand: 24.07.2026</div>
  <div id="privacyContent"></div>
</div>
<script>
  const pageTitleLabel = document.getElementById('pageTitleLabel');
  const backLinkLabel = document.getElementById('backLinkLabel');
  const updatedLabel = document.getElementById('updatedLabel');
  const privacyContent = document.getElementById('privacyContent');
  const languageButtons = document.querySelectorAll('.language-switch button');

  const deContent = `
    <h2>1. Überblick über die Datenverarbeitung</h2>
    <p>Diese Website dient als Business-Auftritt für meine Tätigkeit als Hochzeitsmalerin sowie als Projektblog. Ich verarbeite personenbezogene Daten nur im notwendigen Umfang:</p>
    <ul>
      <li>Es werden keine Cookies gesetzt (außer ggf. technisch notwendige, siehe Hinweis unten).</li>
      <li>Es gibt kein Tracking und keine Analyse-Tools (kein Google Analytics o. Ä.).</li>
      <li>Es gibt keine Benutzerkonten, keine Kommentarfunktion und keine Newsletter-Anmeldung.</li>
      <li>Schriftarten sind lokal eingebunden — beim Besuch wird keine Verbindung zu Google Fonts oder anderen Drittanbietern aufgebaut.</li>
      <li>Es werden keine Inhalte von Drittservern (CDNs, eingebettete Videos, Social-Media-Plugins) automatisch nachgeladen. Instagram ist lediglich als externer Link eingebunden (siehe Punkt 5) — beim bloßen Besuch dieser Website findet keine Datenübertragung an Instagram/Meta statt.</li>
    </ul>

    <h2>2. Server-Logfiles beim Hosting</h2>
    <p>Beim Aufruf dieser Website verarbeitet der Hosting-Anbieter automatisch technisch notwendige Daten (sogenannte Server-Logfiles): IP-Adresse, Datum und Uhrzeit des Zugriffs, aufgerufene Datei, übertragene Datenmenge, Browsertyp und Betriebssystem, ggf. Referrer-URL.</p>
    <p>Diese Verarbeitung erfolgt auf Grundlage von Art. 6 Abs. 1 lit. f DSGVO (berechtigtes Interesse an der technisch fehlerfreien und sicheren Bereitstellung der Website). Die Daten werden nicht mit anderen Datenquellen zusammengeführt.</p>

    <h2>3. Kontaktaufnahme (Kontaktformular / E-Mail)</h2>
    <p>Wenn du mich über das Kontaktformular oder per E-Mail kontaktierst — z. B. mit einer Anfrage zu einer Auftragsmalerei —, übermittelst du dabei personenbezogene Daten (z. B. Name, E-Mail-Adresse, ggf. weitere Angaben zu deiner Anfrage wie Hochzeitsdatum oder Wünsche).</p>
    <p>Diese Daten verwende ich ausschließlich zur Bearbeitung deiner Anfrage bzw. zur Vorbereitung eines möglichen Auftrags und gebe sie nicht an Dritte weiter.</p>
    <ul>
      <li>Rechtsgrundlage: Art. 6 Abs. 1 lit. b DSGVO (vorvertragliche Maßnahmen bzw. Vertragserfüllung, sofern es um eine mögliche Beauftragung geht) bzw. Art. 6 Abs. 1 lit. f DSGVO (berechtigtes Interesse an der Beantwortung allgemeiner Anfragen zum Blog).</li>
      <li>Freiwilligkeit: Die Angabe deiner Daten ist freiwillig, für eine Beantwortung der Anfrage jedoch erforderlich.</li>
      <li>Speicherdauer: Deine Daten werden gelöscht, sobald die Anfrage abschließend bearbeitet bzw. ein möglicher Auftrag abgewickelt ist, sofern keine gesetzlichen Aufbewahrungspflichten (z. B. steuerrechtlich bei Auftragsabwicklung) entgegenstehen.</li>
    </ul>

    <h2>4. Verlinkung zu Instagram</h2>
    <p>Auf dieser Website findest du einen Link (Icon) zu meinem Instagram-Profil. Dabei handelt es sich um einen reinen Hyperlink, kein eingebettetes Plugin oder Feed. Beim bloßen Aufruf dieser Website werden keine Daten an Instagram/Meta übertragen.</p>
    <p>Erst wenn du aktiv auf den Link klickst, verlässt du diese Website und gelangst zu Instagram, wo die Datenschutzbestimmungen von Meta Platforms Ireland Ltd. gelten: <a href="https://privacy.instagram.com" rel="noopener">https://privacy.instagram.com</a>.</p>

    <h2>5. Verwendung von Bildmaterial (Portfolio)</h2>
    <p>Auf dieser Website zeige ich Beispiele meiner Malerei-Arbeiten, teils mit Bezug zu realen Hochzeiten bzw. Auftraggeber:innen.</p>
    <ul>
      <li>Bilder werden nur veröffentlicht, wenn die abgebildeten bzw. betroffenen Personen vorab ausdrücklich eingewilligt haben (Art. 6 Abs. 1 lit. a DSGVO).</li>
      <li>Die Einwilligung kann jederzeit mit Wirkung für die Zukunft widerrufen werden; ich entferne das entsprechende Bild dann zeitnah.</li>
    </ul>

    <h2>6. Keine automatisierte Entscheidungsfindung</h2>
    <p>Es findet keine automatisierte Entscheidungsfindung einschließlich Profiling im Sinne von Art. 22 DSGVO statt.</p>

    <h2>7. Deine Rechte</h2>
    <p>Nach der DSGVO hast du folgende Rechte gegenüber der verantwortlichen Person:</p>
    <ul>
      <li>Auskunft über gespeicherte personenbezogene Daten (Art. 15 DSGVO)</li>
      <li>Berichtigung unrichtiger Daten (Art. 16 DSGVO)</li>
      <li>Löschung (Art. 17 DSGVO) und Einschränkung der Verarbeitung (Art. 18 DSGVO)</li>
      <li>Datenübertragbarkeit (Art. 20 DSGVO)</li>
      <li>Widerspruch gegen die Verarbeitung (Art. 21 DSGVO)</li>
      <li>Widerruf erteilter Einwilligungen mit Wirkung für die Zukunft (Art. 7 Abs. 3 DSGVO)</li>
    </ul>
    <p>Außerdem besteht ein Beschwerderecht bei der österreichischen Datenschutzbehörde: Österreichische Datenschutzbehörde, Barichgasse 40–42, 1030 Wien <a href="https://www.dsb.gv.at" rel="noopener">https://www.dsb.gv.at</a>.</p>

    <h2>8. Änderungen</h2>
    <p>Diese Datenschutzerklärung wird angepasst, sobald sich am Aufbau der Website oder an den verarbeiteten Daten etwas ändert.</p>

    <p><strong>Stand: 24.07.2026</strong></p>
  `;

  const enContent = `
    <h2>1. Overview of data processing</h2>
    <p>This website serves as a business presence for my work as a wedding painter and as a project blog. I only process personal data to the necessary extent:</p>
    <ul>
      <li>No cookies are set (except possibly technically necessary ones, see note below).</li>
      <li>There is no tracking and no analysis tools (no Google Analytics or similar).</li>
      <li>There are no user accounts, no comment function, and no newsletter registration.</li>
      <li>Fonts are loaded locally — visiting the site does not establish a connection to Google Fonts or other third-party providers.</li>
      <li>No third-party content (CDNs, embedded videos, social media plugins) is loaded automatically. Instagram is only linked as an external link (see point 5) — simply visiting this website does not transmit data to Instagram/Meta.</li>
    </ul>

    <h2>2. Server log files during hosting</h2>
    <p>When you call up this website, the hosting provider automatically processes technically necessary data (so-called server log files): IP address, date and time of access, requested file, amount of data transferred, browser type and operating system, and possibly the referrer URL.</p>
    <p>This processing is carried out on the basis of Art. 6(1)(f) GDPR (legitimate interest in the technically error-free and secure provision of the website). The data is not merged with other data sources.</p>

    <h2>3. Contacting me (contact form / email)</h2>
    <p>If you contact me via the contact form or by email — for example, with a request for a commissioned painting — you transmit personal data (such as your name, email address, and possibly further details about your request such as your wedding date or wishes).</p>
    <p>I use this data solely to process your enquiry or to prepare a possible commission and do not pass it on to third parties.</p>
    <ul>
      <li>Legal basis: Art. 6(1)(b) GDPR (pre-contractual measures or contract fulfillment if it concerns a possible commission) or Art. 6(1)(f) GDPR (legitimate interest in answering general inquiries about the blog).</li>
      <li>Voluntariness: Providing your data is voluntary, but necessary to answer your request.</li>
      <li>Storage period: Your data will be deleted once the inquiry has been finally processed or a possible order has been completed, unless legal retention obligations (e.g. tax-related for order processing) stand in the way.</li>
    </ul>

    <h2>4. Link to Instagram</h2>
    <p>You will find a link (icon) to my Instagram profile on this website. This is a simple hyperlink, not an embedded plugin or feed. Simply visiting this website does not send data to Instagram/Meta.</p>
    <p>If you click the link, you leave this website and reach Instagram, where the privacy policy of Meta Platforms Ireland Ltd. applies: <a href="https://privacy.instagram.com" rel="noopener">https://privacy.instagram.com</a>.</p>

    <h2>5. Use of image material (portfolio)</h2>
    <p>On this website I show examples of my painting work, partly in connection with real weddings or clients.</p>
    <ul>
      <li>Images are only published if the persons shown or affected have explicitly consented in advance (Art. 6(1)(a) GDPR).</li>
      <li>Consent may be withdrawn at any time with effect for the future; I will then remove the corresponding image promptly.</li>
    </ul>

    <h2>6. No automated decision-making</h2>
    <p>No automated decision-making, including profiling, within the meaning of Art. 22 GDPR takes place.</p>

    <h2>7. Your rights</h2>
    <p>Under the GDPR, you have the following rights towards the controller:</p>
    <ul>
      <li>Access to stored personal data (Art. 15 GDPR)</li>
      <li>Correction of inaccurate data (Art. 16 GDPR)</li>
      <li>Deletion (Art. 17 GDPR) and restriction of processing (Art. 18 GDPR)</li>
      <li>Data portability (Art. 20 GDPR)</li>
      <li>Objection to processing (Art. 21 GDPR)</li>
      <li>Withdrawal of consent already given with effect for the future (Art. 7(3) GDPR)</li>
    </ul>
    <p>You also have the right to lodge a complaint with the Austrian data protection authority: Austrian Data Protection Authority, Barichgasse 40–42, 1030 Vienna <a href="https://www.dsb.gv.at" rel="noopener">https://www.dsb.gv.at</a>.</p>

    <h2>8. Changes</h2>
    <p>This privacy policy will be adjusted whenever the structure of the website or the data processed changes.</p>

    <p><strong>Effective date: 24.07.2026</strong></p>
  `;

  function setLanguage(lang){
    const isEnglish = lang === 'en';
    localStorage.setItem('siteLanguage', isEnglish ? 'en' : 'de');
    document.documentElement.lang = isEnglish ? 'en' : 'de';
    if(pageTitleLabel) pageTitleLabel.textContent = isEnglish ? 'Privacy Policy' : 'Datenschutzerklärung';
    if(backLinkLabel) backLinkLabel.innerHTML = isEnglish ? '← Back' : '← Zurück';
    if(updatedLabel) updatedLabel.textContent = isEnglish ? 'Effective date: 24.07.2026' : 'Stand: 24.07.2026';
    if(privacyContent) privacyContent.innerHTML = isEnglish ? enContent : deContent;
    languageButtons.forEach((button)=>{
      const active = (isEnglish && button.title === 'English') || (!isEnglish && button.title === 'Deutsch');
      button.setAttribute('aria-pressed', active ? 'true' : 'false');
    });
  }

  const austrianFlag = document.querySelector('.language-switch button[title="Deutsch"]');
  const englishFlag = document.querySelector('.language-switch button[title="English"]');
  if(austrianFlag) austrianFlag.addEventListener('click', ()=> setLanguage('de'));
  if(englishFlag) englishFlag.addEventListener('click', ()=> setLanguage('en'));

  setLanguage(window.__siteLanguage || 'de');
</script>
</body>
</html>
