<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 600" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <linearGradient id="f-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#42604a"/>
      <stop offset="55%" stop-color="#33503d"/>
      <stop offset="100%" stop-color="#243b2d"/>
    </linearGradient>
    <linearGradient id="f-sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d3126"/>
      <stop offset="100%" stop-color="#12211a"/>
    </linearGradient>
  </defs>
  <rect width="450" height="600" fill="url(#f-sky)"/>
  <!-- low sun -->
  <circle cx="330" cy="332" r="38" fill="#e6d9bc" opacity="0.9"/>
  <circle cx="330" cy="332" r="52" fill="none" stroke="#e6d9bc" stroke-width="1" opacity="0.35"/>
  <!-- sea -->
  <rect y="360" width="450" height="240" fill="url(#f-sea)"/>
  <line x1="0" y1="360" x2="450" y2="360" stroke="#0d1912" stroke-width="1.4"/>
  <!-- wake lines -->
  <g stroke="#9fb8a4" stroke-width="1" opacity="0.5">
    <line x1="30" y1="402" x2="420" y2="402" opacity="0.55"/>
    <line x1="60" y1="428" x2="390" y2="428" opacity="0.4"/>
    <line x1="20" y1="458" x2="430" y2="458" opacity="0.3"/>
    <line x1="80" y1="486" x2="370" y2="486" opacity="0.22"/>
  </g>
  <!-- ferry silhouette -->
  <g fill="#0e1b14">
    <path d="M138 372 L312 372 L296 396 L154 396 Z"/>
    <rect x="168" y="352" width="114" height="20" rx="2"/>
    <rect x="196" y="336" width="44" height="16" rx="2"/>
    <rect x="252" y="326" width="7" height="26" rx="1"/>
  </g>
  <g fill="#e6d9bc" opacity="0.85">
    <rect x="174" y="357" width="7" height="7" rx="1"/><rect x="188" y="357" width="7" height="7" rx="1"/>
    <rect x="202" y="357" width="7" height="7" rx="1"/><rect x="216" y="357" width="7" height="7" rx="1"/>
    <rect x="230" y="357" width="7" height="7" rx="1"/><rect x="244" y="357" width="7" height="7" rx="1"/>
    <rect x="258" y="357" width="7" height="7" rx="1"/><rect x="272" y="357" width="7" height="7" rx="1"/>
  </g>
  <!-- lighthouses counted like sheep -->
  <g fill="#e6d9bc">
    <g transform="translate(52,340)"><rect x="-3" y="0" width="6" height="20"/><circle cy="-4" r="4" opacity="0.95"/></g>
    <g transform="translate(398,346)" opacity="0.8"><rect x="-2.5" y="0" width="5" height="14"/><circle cy="-3" r="3"/></g>
    <g transform="translate(122,350)" opacity="0.55"><rect x="-2" y="0" width="4" height="10"/><circle cy="-2.5" r="2.4"/></g>
  </g>
  <!-- title -->
  <text x="225" y="92" text-anchor="middle" font-size="44" fill="#efe6d2" letter-spacing="1">Die lange Fähre</text>
  <line x1="150" y1="118" x2="300" y2="118" stroke="#a9822f" stroke-width="1.2"/>
  <text x="225" y="146" text-anchor="middle" font-size="15" font-style="italic" fill="#cbb98f" letter-spacing="2">Roman</text>
  <text x="225" y="556" text-anchor="middle" font-size="19" fill="#e6d9bc" letter-spacing="3">SAM OKAFOR</text>
</svg>
