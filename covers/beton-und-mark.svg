<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 600" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <linearGradient id="c-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4c4c47"/>
      <stop offset="100%" stop-color="#2e2e2a"/>
    </linearGradient>
    <linearGradient id="c-block" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6b6b64"/>
