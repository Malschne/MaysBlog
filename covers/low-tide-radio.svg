<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 600" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <linearGradient id="r-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c99b3f"/>
      <stop offset="60%" stop-color="#b3852f"/>
      <stop offset="100%" stop-color="#8f6a24"/>
    </linearGradient>
  </defs>
  <rect width="450" height="600" fill="url(#r-sky)"/>
  <!-- big evening sun -->
  <circle cx="225" cy="392" r="88" fill="#f2dfae"/>
  <!-- sea stripes over the sun -->
  <g stroke="#8f6a24" stroke-width="10">
    <line x1="0" y1="408" x2="450" y2="408"/>
    <line x1="0" y1="432" x2="450" y2="432"/>
    <line x1="0" y1="456" x2="450" y2="456"/>
  </g>
  <g stroke="#7a5a1e" stroke-width="10">
    <line x1="0" y1="480" x2="450" y2="480"/>
    <line x1="0" y1="504" x2="450" y2="504"/>
    <line x1="0" y1="528" x2="450" y2="528"/>
    <line x1="0" y1="552" x2="450" y2="552"/>
    <line x1="0" y1="576" x2="450" y2="576"/>
  </g>
  <!-- beach shack + mast -->
  <g fill="#4a3220">
    <polygon points="94,404 176,404 176,360 135,338 94,360"/>
    <rect x="126" y="376" width="20" height="28"/>
  </g>
  <rect x="150" y="352" width="14" height="10" fill="#f2dfae" opacity="0.9"/>
  <line x1="135" y1="338" x2="135" y2="230" stroke="#4a3220" stroke-width="5"/>
  <circle cx="135" cy="226" r="5" fill="#4a3220"/>
  <!-- broadcast arcs -->
  <g fill="none" stroke="#f6ecd0" stroke-width="3" stroke-linecap="round">
    <path d="M158 204 a32 32 0 0 1 0 45" opacity="0.95"/>
    <path d="M176 186 a58 58 0 0 1 0 81" opacity="0.7"/>
    <path d="M194 168 a84 84 0 0 1 0 117" opacity="0.45"/>
    <path d="M112 204 a32 32 0 0 0 0 45" opacity="0.95"/>
    <path d="M94 186 a58 58 0 0 0 0 81" opacity="0.7"/>
    <path d="M76 168 a84 84 0 0 0 0 117" opacity="0.45"/>
  </g>
  <!-- title, like a station sticker -->
  <g transform="translate(225,84) rotate(-2)">
    <rect x="-158" y="-38" width="316" height="76" rx="6" fill="#3c2c16"/>
    <text y="-2" text-anchor="middle" font-size="34" fill="#f6ecd0" letter-spacing="2">LOW TIDE</text>
    <text y="28" text-anchor="middle" font-size="22" fill="#e0b95c" letter-spacing="8">RADIO</text>
  </g>
  <text x="225" y="586" text-anchor="middle" font-size="17" fill="#f6ecd0" letter-spacing="3" opacity="0.9">MARCUS WHITFIELD</text>
</svg>
