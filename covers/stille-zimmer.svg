<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 600" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <linearGradient id="z-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a6743"/>
      <stop offset="100%" stop-color="#6e4229"/>
    </linearGradient>
  </defs>
  <rect width="450" height="600" fill="url(#z-bg)"/>
  <!-- a floor plan of quiet rooms, drawn in pale ink -->
  <g fill="none" stroke="#f2e6d4" stroke-width="2.4" opacity="0.9">
    <rect x="82" y="196" width="286" height="300"/>
    <line x1="82" y1="316" x2="230" y2="316"/>
    <line x1="230" y1="196" x2="230" y2="380"/>
    <line x1="230" y1="380" x2="368" y2="380"/>
    <line x1="150" y1="316" x2="150" y2="496"/>
    <line x1="286" y1="380" x2="286" y2="496"/>
    <!-- door openings (gaps drawn as arcs) -->
    <path d="M186 316 a28 28 0 0 1 28 -28" stroke-width="1.2"/>
    <path d="M230 424 a26 26 0 0 1 26 26" stroke-width="1.2"/>
  </g>
  <!-- the one door ajar, warm light spilling -->
  <g>
    <polygon points="330,196 368,196 368,290 330,262" fill="#f0c98a" opacity="0.55"/>
    <line x1="330" y1="196" x2="330" y2="262" stroke="#f2e6d4" stroke-width="2.4"/>
    <line x1="330" y1="196" x2="356" y2="236" stroke="#f2e6d4" stroke-width="2.8"/>
  </g>
  <!-- a single chair in the largest room -->
  <g stroke="#f2e6d4" stroke-width="2" fill="none" opacity="0.85">
    <rect x="168" y="416" width="26" height="26" rx="3"/>
    <line x1="168" y1="416" x2="168" y2="404"/>
    <line x1="194" y1="416" x2="194" y2="404"/>
    <line x1="168" y1="404" x2="194" y2="404"/>
  </g>
  <!-- title -->
  <text x="225" y="84" text-anchor="middle" font-size="36" fill="#f6ecd8" letter-spacing="0.5">Eine Studie in</text>
  <text x="225" y="126" text-anchor="middle" font-size="36" fill="#f6ecd8" letter-spacing="0.5">stillen Zimmern</text>
  <line x1="162" y1="152" x2="288" y2="152" stroke="#f0c98a" stroke-width="1.1"/>
  <text x="225" y="556" text-anchor="middle" font-size="19" fill="#f2e6d4" letter-spacing="3">HELENA CHO</text>
</svg>
