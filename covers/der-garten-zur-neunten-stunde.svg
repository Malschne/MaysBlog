<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 600" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <linearGradient id="g-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6a568f"/>
      <stop offset="100%" stop-color="#453766"/>
    </linearGradient>
    <radialGradient id="g-light" cx="50%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#f2e2b6" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#c9ab7a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#c9ab7a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="450" height="600" fill="url(#g-bg)"/>
  <!-- garden wall -->
  <rect x="40" y="240" width="370" height="270" fill="#38295434" stroke="#2e2247" stroke-width="0"/>
  <g fill="#3a2b58">
    <rect x="40" y="240" width="370" height="270"/>
  </g>
  <!-- brick joints -->
  <g stroke="#48376c" stroke-width="1.4">
    <line x1="40" y1="286" x2="410" y2="286"/><line x1="40" y1="332" x2="410" y2="332"/>
    <line x1="40" y1="378" x2="410" y2="378"/><line x1="40" y1="424" x2="410" y2="424"/>
    <line x1="40" y1="470" x2="410" y2="470"/>
    <line x1="120" y1="240" x2="120" y2="286"/><line x1="230" y1="240" x2="230" y2="286"/><line x1="340" y1="240" x2="340" y2="286"/>
    <line x1="80" y1="286" x2="80" y2="332"/><line x1="180" y1="286" x2="180" y2="332"/><line x1="290" y1="286" x2="290" y2="332"/><line x1="390" y1="286" x2="390" y2="332"/>
    <line x1="120" y1="332" x2="120" y2="378"/><line x1="230" y1="332" x2="230" y2="378"/><line x1="340" y1="332" x2="340" y2="378"/>
    <line x1="80" y1="378" x2="80" y2="424"/><line x1="180" y1="378" x2="180" y2="424"/><line x1="290" y1="378" x2="290" y2="424"/><line x1="390" y1="378" x2="390" y2="424"/>
    <line x1="120" y1="424" x2="120" y2="470"/><line x1="230" y1="424" x2="230" y2="470"/><line x1="340" y1="424" x2="340" y2="470"/>
  </g>
  <!-- the arched door, glowing -->
  <path d="M172 510 L172 330 A53 53 0 0 1 278 330 L278 510 Z" fill="url(#g-light)" stroke="#f2e2b6" stroke-width="2"/>
  <path d="M225 510 L225 292" stroke="#f2e2b6" stroke-width="1" opacity="0.5"/>
  <!-- vines over the wall -->
  <g fill="none" stroke="#8fae7e" stroke-width="2.2" stroke-linecap="round">
    <path d="M40 240 C 90 268, 74 320, 118 342"/>
    <path d="M410 240 C 372 282, 396 330, 356 366"/>
    <path d="M40 240 C 110 250, 150 236, 196 258"/>
  </g>
  <g fill="#8fae7e">
    <circle cx="118" cy="342" r="4"/><circle cx="356" cy="366" r="4"/><circle cx="196" cy="258" r="4"/>
    <circle cx="84" cy="292" r="3"/><circle cx="388" cy="300" r="3"/>
  </g>
  <!-- the hour dial above, showing IX -->
  <g transform="translate(225,160)">
    <circle r="46" fill="none" stroke="#e9d8a6" stroke-width="1.6"/>
    <circle r="40" fill="none" stroke="#e9d8a6" stroke-width="0.6" opacity="0.5"/>
    <g stroke="#e9d8a6" stroke-width="1.4">
      <line y1="-46" y2="-38"/><line x1="46" x2="38"/><line y1="46" y2="38"/><line x1="-46" x2="-38"/>
    </g>
    <text y="8" text-anchor="middle" font-size="26" fill="#f2e2b6" letter-spacing="2">IX</text>
    <line x1="0" y1="0" x2="-22" y2="-14" stroke="#f2e2b6" stroke-width="2"/>
  </g>
  <!-- title -->
  <text x="225" y="62" text-anchor="middle" font-size="31" fill="#f2ead6" letter-spacing="0.5">Der Garten zur</text>
  <text x="225" y="98" text-anchor="middle" font-size="31" fill="#f2ead6" letter-spacing="0.5">neunten Stunde</text>
  <text x="225" y="560" text-anchor="middle" font-size="18" fill="#e9d8a6" letter-spacing="3">PRIYA ANAND</text>
</svg>
