<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 600" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <radialGradient id="b-bg" cx="50%" cy="42%" r="80%">
      <stop offset="0%" stop-color="#31506b"/>
      <stop offset="100%" stop-color="#182a3a"/>
    </radialGradient>
    <filter id="b-static" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="turbulence" baseFrequency="0.012 0.9" numOctaves="1" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="7"/>
    </filter>
  </defs>
  <rect width="450" height="600" fill="url(#b-bg)"/>
  <!-- scanlines -->
  <g stroke="#0e1c28" stroke-width="1" opacity="0.5">
    <line x1="0" y1="40" x2="450" y2="40"/><line x1="0" y1="80" x2="450" y2="80"/>
    <line x1="0" y1="120" x2="450" y2="120"/><line x1="0" y1="160" x2="450" y2="160"/>
    <line x1="0" y1="200" x2="450" y2="200"/><line x1="0" y1="240" x2="450" y2="240"/>
    <line x1="0" y1="280" x2="450" y2="280"/><line x1="0" y1="320" x2="450" y2="320"/>
    <line x1="0" y1="360" x2="450" y2="360"/><line x1="0" y1="400" x2="450" y2="400"/>
    <line x1="0" y1="440" x2="450" y2="440"/><line x1="0" y1="480" x2="450" y2="480"/>
    <line x1="0" y1="520" x2="450" y2="520"/><line x1="0" y1="560" x2="450" y2="560"/>
  </g>
  <!-- the bloom: concentric petals, glitching -->
  <g filter="url(#b-static)" fill="none" stroke="#a8c6b4">
    <circle cx="225" cy="300" r="26" stroke-width="2.4"/>
    <circle cx="225" cy="300" r="52" stroke-width="1.8" opacity="0.9"/>
    <circle cx="225" cy="300" r="80" stroke-width="1.6" opacity="0.75"/>
    <circle cx="225" cy="300" r="110" stroke-width="1.4" opacity="0.6"/>
    <circle cx="225" cy="300" r="142" stroke-width="1.2" opacity="0.45"/>
    <circle cx="225" cy="300" r="176" stroke-width="1" opacity="0.3"/>
  </g>
  <g filter="url(#b-static)" stroke="#dfe8d2" stroke-width="1.6" opacity="0.85">
    <line x1="225" y1="300" x2="225" y2="188"/>
    <line x1="225" y1="300" x2="322" y2="245"/>
    <line x1="225" y1="300" x2="322" y2="356"/>
    <line x1="225" y1="300" x2="225" y2="412"/>
    <line x1="225" y1="300" x2="128" y2="356"/>
    <line x1="225" y1="300" x2="128" y2="245"/>
  </g>
  <circle cx="225" cy="300" r="9" fill="#e8f0dc"/>
  <!-- title -->
  <text x="225" y="80" text-anchor="middle" font-size="46" fill="#dfe8d2" letter-spacing="6">STATIC</text>
  <text x="225" y="132" text-anchor="middle" font-size="46" fill="#dfe8d2" letter-spacing="6">BLOOM</text>
  <text x="225" y="548" text-anchor="middle" font-size="18" fill="#a8c6b4" letter-spacing="3">IDRIS CALLOWAY</text>
</svg>
