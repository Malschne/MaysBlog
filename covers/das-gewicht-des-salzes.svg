<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 600" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <linearGradient id="s-base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a3535"/>
      <stop offset="100%" stop-color="#5e2222"/>
    </linearGradient>
    <linearGradient id="s-pan1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0e4cd"/><stop offset="100%" stop-color="#d9c3a8"/>
    </linearGradient>
    <linearGradient id="s-pan2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8cfc0"/><stop offset="100%" stop-color="#cfa892"/>
    </linearGradient>
    <linearGradient id="s-pan3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dfb8ab"/><stop offset="100%" stop-color="#b98878"/>
    </linearGradient>
  </defs>
  <rect width="450" height="600" fill="url(#s-base)"/>
  <!-- salt evaporation ponds seen from above, perspective trapezoids -->
  <g stroke="#5e2222" stroke-width="3">
    <polygon points="60,250 210,250 196,318 38,318" fill="url(#s-pan1)"/>
    <polygon points="226,250 392,250 402,318 212,318" fill="url(#s-pan2)"/>
    <polygon points="34,334 194,334 176,420 4,420" fill="url(#s-pan2)"/>
    <polygon points="210,334 404,334 420,420 190,420" fill="url(#s-pan3)"/>
    <polygon points="0,438 172,438 148,548 0,548" fill="url(#s-pan3)"/>
    <polygon points="186,438 424,438 450,548 160,548" fill="url(#s-pan1)"/>
  </g>
  <!-- salt heaps -->
  <g fill="#f6ecd8">
    <path d="M118 300 l16 -20 l16 20 z"/>
    <path d="M298 396 l19 -24 l19 24 z"/>
    <path d="M84 512 l22 -28 l22 28 z"/>
  </g>
  <!-- three figures, far apart: the sisters -->
  <g fill="#3a1616">
    <circle cx="256" cy="288" r="4"/><rect x="253" y="292" width="6" height="14" rx="2"/>
    <circle cx="120" cy="384" r="4"/><rect x="117" y="388" width="6" height="14" rx="2"/>
    <circle cx="330" cy="490" r="4"/><rect x="327" y="494" width="6" height="14" rx="2"/>
  </g>
  <!-- title -->
  <text x="225" y="86" text-anchor="middle" font-size="40" fill="#f6ecd8" letter-spacing="0.5">Das Gewicht</text>
  <text x="225" y="132" text-anchor="middle" font-size="40" fill="#f6ecd8" letter-spacing="0.5">des Salzes</text>
  <line x1="168" y1="160" x2="282" y2="160" stroke="#f6ecd8" stroke-width="1" opacity="0.7"/>
  <text x="225" y="196" text-anchor="middle" font-size="18" fill="#eeD7c2" letter-spacing="3">NAOMI FERRO</text>
</svg>
