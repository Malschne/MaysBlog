<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitleTag">Sommerkleid - May's Blog</title>
<meta name="description" id="pageDescriptionTag" content="Projektseite: Sommerkleid.">
<script>
  window.__siteLanguage = localStorage.getItem('siteLanguage') === 'en' ? 'en' : 'de';
  document.documentElement.lang = window.__siteLanguage;
</script>
<link rel="icon" href="logomail.jpeg">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root{--rule:rgba(42,36,32,0.18);--ink:#2a2420;--ink-soft:#6b5d4c;--oxblood:#7c2f2f;}
  *{box-sizing:border-box;} body{margin:0;font-family:'Source Serif 4', Georgia, serif;background:#efe6d2;color:var(--ink);} 
  header.site{position:sticky;top:0;z-index:40;background:linear-gradient(to right, rgba(230,190,210,0.92) 0%, rgba(255,255,255,0.92) 50%, rgba(230,190,210,0.92) 100%);backdrop-filter:blur(6px);border-bottom:1px solid var(--rule);} 
  .site-bar{display:flex;align-items:center;justify-content:space-between;padding:18px 28px;max-width:1180px;margin:0 auto;gap:24px;} 
  .back-link{font-family:'JetBrains Mono',monospace;font-size:0.7rem;letter-spacing:0.08em;text-transform:uppercase;text-decoration:none;color:#c8a8b0;} 
  .site-title{font-family:'Fraunces',Georgia,serif;font-weight:700;font-size:1.3rem;line-height:1;letter-spacing:-0.01em;margin:0;color:#c8a8b0;flex:1;text-align:center;} 
  .language-switch{display:flex;align-items:center;gap:8px;margin-left:14px;}
  .language-switch .language-sep{color:#c8a8b0;opacity:0.6;font-size:0.9rem;line-height:1;user-select:none;}
  .language-switch button{font-size:1rem;line-height:1;background:none;border:none;cursor:pointer;filter:saturate(0.95);transition:transform .18s, filter .18s, opacity .18s;}
  .language-switch button:hover{transform:translateY(-1px);filter:saturate(1.1);opacity:0.9;}
  main{max-width:980px;margin:0 auto;padding:52px 28px 70px;} 
  .panel{background:rgba(255,255,255,0.72);border:1px solid rgba(255,255,255,0.85);border-radius:12px;padding:30px;box-shadow:0 14px 34px -20px rgba(20,14,8,0.45);} 
  h2{font-family:'Fraunces',Georgia,serif;font-size:2rem;margin:0 0 10px;color:var(--oxblood);} p{margin:0;line-height:1.8;color:var(--ink-soft);} 
</style>
</head>
<body>
<header class="site"><div class="site-bar"><a href="index.html" class="back-link" id="backLinkLabel">Zurueck</a><h1 class="site-title" id="pageTitleLabel">Sommerkleid</h1><div class="language-switch" aria-label="Language switcher"><button type="button" aria-label="Deutsch" title="Deutsch">🇦🇹</button><span class="language-sep" aria-hidden="true">|</span><button type="button" aria-label="English" title="English">🇬🇧</button></div></div></header>
<main>
  <section class="panel">
    <h2 id="pageHeadingLabel">Sommerkleid</h2>
    <p id="pageTextLabel">Hier entsteht dein Projektbereich fuer Entwurf, Stoffwahl, Schnitt und die fertige Sommerkleid-Idee.</p>
  </section>
</main>

<script>
function initLanguageToggle(){
  const pageTitleTag = document.getElementById('pageTitleTag');
  const pageDescriptionTag = document.getElementById('pageDescriptionTag');
  const pageTitleLabel = document.getElementById('pageTitleLabel');
  const backLinkLabel = document.getElementById('backLinkLabel');
  const pageHeadingLabel = document.getElementById('pageHeadingLabel');
  const pageTextLabel = document.getElementById('pageTextLabel');
  const languageButtons = document.querySelectorAll('.language-switch button');

  const de = {
    title: 'Sommerkleid - May\'s Blog',
    description: 'Projektseite: Sommerkleid.',
    pageTitle: 'Sommerkleid',
    back: 'Zurueck',
    heading: 'Sommerkleid',
    text: 'Hier entsteht dein Projektbereich fuer Entwurf, Stoffwahl, Schnitt und die fertige Sommerkleid-Idee.'
  };
  const en = {
    title: 'Summer Dress - May\'s Blog',
    description: 'Project page: Summer Dress.',
    pageTitle: 'Summer Dress',
    back: 'Back',
    heading: 'Summer Dress',
    text: 'This is where your project area for the design, fabric choice, pattern, and final summer dress idea will take shape.'
  };

  function setLanguage(lang){
    const copy = lang === 'en' ? en : de;
    document.documentElement.lang = lang === 'en' ? 'en' : 'de';
    localStorage.setItem('siteLanguage', lang === 'en' ? 'en' : 'de');
    if(pageTitleTag) pageTitleTag.textContent = copy.title;
    if(pageDescriptionTag) pageDescriptionTag.setAttribute('content', copy.description);
    if(pageTitleLabel) pageTitleLabel.textContent = copy.pageTitle;
    if(backLinkLabel) backLinkLabel.textContent = copy.back;
    if(pageHeadingLabel) pageHeadingLabel.textContent = copy.heading;
    if(pageTextLabel) pageTextLabel.textContent = copy.text;
    languageButtons.forEach((button)=>{
      const active = (lang === 'en' && button.title === 'English') || (lang !== 'en' && button.title === 'Deutsch');
      button.setAttribute('aria-pressed', active ? 'true' : 'false');
    });
  }

  const austrianFlag = document.querySelector('.language-switch button[title="Deutsch"]');
  const englishFlag = document.querySelector('.language-switch button[title="English"]');
  if(austrianFlag && !austrianFlag.dataset.bound){
    austrianFlag.dataset.bound = '1';
    austrianFlag.addEventListener('click', ()=> setLanguage('de'));
  }
  if(englishFlag && !englishFlag.dataset.bound){
    englishFlag.dataset.bound = '1';
    englishFlag.addEventListener('click', ()=> setLanguage('en'));
  }

  setLanguage(window.__siteLanguage || 'de');
}

if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initLanguageToggle);
else initLanguageToggle();
</script>
</body>
</html>
